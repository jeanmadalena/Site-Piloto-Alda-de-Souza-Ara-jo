<svg width="1200" height="1500" viewBox="0 0 1200 1500" xmlns="http://www.w3.org/2000/svg" font-family="'Montserrat', 'Arial', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFCFF"/>
      <stop offset="100%" stop-color="#F0F4F8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F2B48" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1500" fill="url(#bgGrad)"/>

  <!-- Top-Right Decorative Curve -->
  <path d="M800 0 C950 40 1100 120 1200 200 L1200 0 Z" fill="#1B4980" opacity="0.9"/>
  <path d="M880 0 C1000 60 1120 160 1200 260 L1200 0 Z" fill="#D9A21B" opacity="0.85"/>

  <!-- Top-Left Circuit Lines Decoration -->
  <path d="M 0 50 C 100 50, 150 150, 250 150 M 0 100 C 80 100, 120 220, 200 220" stroke="#1B4980" stroke-width="3" fill="none" opacity="0.2"/>
  <circle cx="250" cy="150" r="6" fill="#1B4980" opacity="0.4"/>
  <circle cx="200" cy="220" r="6" fill="#1B4980" opacity="0.4"/>

  <!-- Bottom-Right Decorative Accent -->
  <path d="M1200 1300 C1100 1380 950 1450 850 1500 L1200 1500 Z" fill="#1B4980" opacity="0.95"/>
  <path d="M1200 1360 C1120 1420 1020 1470 950 1500 L1200 1500 Z" fill="#D9A21B" opacity="0.85"/>

  <!-- HEADER LOGO AREA -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Tree/Wings Symbol -->
    <g transform="translate(0, 0)">
      <!-- Wings -->
      <path d="M-120 20 C-140 -40 -70 -90 -20 -30 C-10 -70 30 -80 0 10 Z" fill="none" stroke="#1B4980" stroke-width="4"/>
      <!-- Tree Canopy -->
      <circle cx="0" cy="-50" r="45" fill="none" stroke="#1B4980" stroke-width="3" stroke-dasharray="6 4"/>
      <circle cx="-20" cy="-60" r="8" fill="#22C55E"/>
      <circle cx="15" cy="-65" r="10" fill="#3B82F6"/>
      <circle cx="25" cy="-40" r="7" fill="#EAB308"/>
      <circle cx="-15" cy="-35" r="9" fill="#EC4899"/>
      <circle cx="0" cy="-70" r="7" fill="#8B5CF6"/>
      <!-- Trunk / Hands -->
      <path d="M-10 10 C-5 -20 -15 -40 0 -50 C15 -40 5 -20 10 10 Z" fill="#D9A21B"/>
    </g>
    
    <!-- Motto -->
    <text y="65" font-size="20" font-weight="600" letter-spacing="4" fill="#475569">APRENDER É VOAR FORA DA ASA</text>
  </g>

  <!-- MAIN TITLE -->
  <text x="600" y="370" text-anchor="middle" font-size="88" font-weight="900" fill="#0F3870" letter-spacing="2">REUNIÃO DE PAIS</text>
  
  <!-- DATE -->
  <text x="600" y="490" text-anchor="middle" font-size="115" font-weight="900" fill="#D9A21B" letter-spacing="4">01/08/2026</text>

  <!-- SCHEDULE CARDS -->
  <!-- Card 1: 8º e 9º Anos -->
  <g transform="translate(80, 580)" filter="url(#shadow)">
    <rect width="500" height="320" rx="28" fill="#FFF9E6" stroke="#F59E0B" stroke-width="3"/>
    
    <!-- Icon -->
    <g transform="translate(250, 80)" fill="none" stroke="#0F3870" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-15" cy="-20" r="16"/>
      <path d="M-40 25 C-40 0 -15 0 -15 0 C-15 0 10 0 10 25"/>
      <circle cx="20" cy="-10" r="12" fill="#0F3870"/>
      <path d="M5 25 C5 10 20 10 20 10 C20 10 35 10 35 25"/>
    </g>

    <text x="250" y="180" text-anchor="middle" font-size="46" font-weight="900" fill="#0F3870">8º E 9º ANOS</text>
    <text x="250" y="250" text-anchor="middle" font-size="40" font-weight="800" fill="#0F3870">DAS 8:30 ÀS 9:50</text>
  </g>

  <!-- Card 2: 6º e 7º Anos -->
  <g transform="translate(620, 580)" filter="url(#shadow)">
    <rect width="500" height="320" rx="28" fill="#EDF5FF" stroke="#3B82F6" stroke-width="3"/>
    
    <!-- Icon -->
    <g transform="translate(250, 80)" fill="none" stroke="#D9A21B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-25" r="14"/>
      <path d="M-20 20 C-20 -5 0 -5 0 -5 C0 -5 20 -5 20 20"/>
      <circle cx="-30" cy="-15" r="11"/>
      <path d="M-45 20 C-45 5 -30 5 -30 5"/>
      <circle cx="30" cy="-15" r="11"/>
      <path d="M45 20 C45 5 30 5 30 5"/>
    </g>

    <text x="250" y="180" text-anchor="middle" font-size="46" font-weight="900" fill="#D9A21B">6º E 7º ANOS</text>
    <text x="250" y="250" text-anchor="middle" font-size="40" font-weight="800" fill="#D9A21B">DAS 10:10 ÀS 11:30</text>
  </g>

  <!-- BOTTOM FOOD BANNER -->
  <g transform="translate(100, 980)" filter="url(#shadow)">
    <!-- Banner Ribbon Background -->
    <path d="M -40 50 L 0 0 L 1040 0 L 1080 50 L 1040 100 L 0 100 Z" fill="#F59E0B"/>
    <rect x="20" y="12" width="1000" height="76" rx="16" fill="#FFFFFF"/>

    <!-- Coxinha & Açaí Food Icons -->
    <g transform="translate(90, 50)">
      <!-- Coxinha -->
      <path d="M -20 12 C -20 -15 -5 -25 0 -25 C 5 -25 20 -15 20 12 C 20 20 -20 20 -20 12 Z" fill="#D97706" stroke="#B45309" stroke-width="2"/>
      <!-- Açaí Bowl -->
      <path d="M 20 0 A 20 20 0 0 1 60 0 Z" fill="#581C87" stroke="#3B0764" stroke-width="2"/>
      <rect x="30" y="-12" width="20" height="10" rx="3" fill="#A855F7"/>
    </g>

    <!-- Text -->
    <text x="560" y="62" text-anchor="middle" font-size="32" font-weight="900" fill="#0F3870" letter-spacing="1">
      COMBOS DE COXINHA E AÇAÍ DISPONÍVEIS NO LOCAL.
    </text>
  </g>

  <!-- FOOTER SCHOOL NAME -->
  <text x="600" y="1220" text-anchor="middle" font-size="28" font-weight="700" fill="#1B4980" letter-spacing="2">
    EMEFI PROF.ª ALDA DE SOUZA ARAÚJO • SÃO JOSÉ DOS CAMPOS
  </text>
</svg>